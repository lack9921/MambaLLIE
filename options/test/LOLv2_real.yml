# general settings
name: test_LOLv2_real
model_type: MambaLLIE
scale: 1
num_gpu: 1
gpu_ids: [0]
manual_seed: 10

datasets:
  test_1:
    name: Blur
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Blur/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Blur/LQ
    io_backend:
      type: disk
    scale: 1
  test_2:
    name: Haze
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Haze/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Haze/LQ
    io_backend:
      type: disk
    scale: 1
  test_3:
    name: Lowlight
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Lowlight/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Lowlight/LQ
    io_backend:
      type: disk
    scale: 1
  test_4:
    name: Rain
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Rain/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Rain/LQ
    io_backend:
      type: disk
    scale: 1
  test_5:
    name: Snow
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Snow/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Snow/LQ
    io_backend:
      type: disk
    scale: 1

# network structures
network_g:
  type: MambaLLIE
  nf: 48
  img_size: 128
  d_state: 32
  depths: [1,2,2,2,2,1]
  embed_dim: 48
  mlp_ratio: 2


# path
path:
  pretrain_network_g: /home/elvis/project/MambaLLIE/weights/LOLv2_real.pth
  strict_load_g: True

# validation settings
val:
  save_img: True
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 0
      test_y_channel: true

