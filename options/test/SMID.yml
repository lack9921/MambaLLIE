# general settings
name: SMID
model_type: MambaLLIE
scale: 1
num_gpu: 1
manual_seed: 10

# dataset and data loader settings
datasets:
  test_1:
    name: Blur
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Blur/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Blur/LQ
    cache_data: true
    N_frames: 5
    padding: new_info
    train_size: [960, 512]
    io_backend:
      type: disk
  
  test_2:
    name: Haze
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Haze/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Haze/LQ
    cache_data: true
    N_frames: 5
    padding: new_info
    train_size: [960, 512]
    io_backend:
      type: disk

  test_3:
    name: Lowlight
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Lowlight/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Lowlight/LQ
    cache_data: true
    N_frames: 5
    padding: new_info
    train_size: [960, 512]
    io_backend:
      type: disk

  test_4:
    name: Rain
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Rain/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Rain/LQ
    cache_data: true
    N_frames: 5
    padding: new_info
    train_size: [960, 512]
    io_backend:
      type: disk
  
  test_5:
    name: Snow
    type: PairedImageDataset
    dataroot_gt: /home/elvis/project/dataset/dataset/LoViF_val/Snow/GT
    dataroot_lq: /home/elvis/project/dataset/dataset/LoViF_val/Snow/LQ
    cache_data: true
    N_frames: 5
    padding: new_info
    train_size: [960, 512]
    io_backend:
      type: disk

# network structures
network_g:
  type: MambaLLIE
  nf: 48
  img_size: 128
  d_state: 32
  depths: [1,2,2,2,2,1]
  embed_dim: 48
  mlp_ratio: 2

# path
path:
  pretrain_network_g: /home/elvis/project/MambaLLIE/weights/SMID.pth
  strict_load_g: True

# validation settings
val:
  save_img: True
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false


